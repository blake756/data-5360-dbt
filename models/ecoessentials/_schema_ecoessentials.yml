version: 2

sources:
  - name: dw_ecoessentials
    database: BLAKEHOBBS
    schema: RAW_ECOESSENTIALS_PG_ECOESSENTIALS_TRANSACTIONAL_DB
    tables:
      - name: MARKETINGEMAILS

models:

  # ======================
  # DIMENSIONS
  # ======================

  - name: dim_user
    columns:
      - name: user_key
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_timestamp
    columns:
      - name: timestamp_key
        tests:
          - unique
          - not_null

  - name: dim_email
    columns:
      - name: email_key
        tests:
          - unique
          - not_null

  - name: dim_event
    columns:
      - name: event_key
        tests:
          - unique
          - not_null
      - name: event_type
        tests:
          - accepted_values:
              values: ['sent', 'open', 'click', 'bounce', 'unsubscribe']

  - name: dim_product
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_type
        tests:
          - not_null

  - name: dim_campaign
    columns:
      - name: campaign_key
        tests:
          - unique
          - not_null

  # ======================
  # FACT TABLES
  # ======================

  - name: fact_marketing_email_events
    columns:
      - name: marketing_email_event_key
        tests:
          - unique
          - not_null

      - name: user_key
        tests:
          - relationships:
              to: ref('dim_user')
              field: user_key

      - name: event_key
        tests:
          - relationships:
              to: ref('dim_event')
              field: event_key

      - name: email_key
        tests:
          - relationships:
              to: ref('dim_email')
              field: email_key

      - name: campaign_key
        tests:
          - relationships:
              to: ref('dim_campaign')
              field: campaign_key

  - name: fact_order_line
    columns:
      - name: order_line_key
        tests:
          - unique
          - not_null

      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key

      - name: user_key
        tests:
          - relationships:
              to: ref('dim_user')
              field: user_key

      - name: campaign_key
        tests:
          - relationships:
              to: ref('dim_campaign')
              field: campaign_key
              